<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RFP profile loading – RFP Buddy</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/fieldtrip/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.navi{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;font-size:14px;color:var(--ink);text-decoration:none}
.sk{display:block;border-radius:6px;background:#ebe8e7;animation:ftsk 1.6s ease-in-out infinite}
@keyframes ftsk{0%,100%{opacity:1}50%{opacity:0.45}}
.card{border:1px solid #e7e4e4;border-radius:10px;padding:20px}
.step{display:flex;align-items:center;gap:8px;font-size:13px;line-height:18px}
.spin{width:12px;height:12px;border:2px solid #e7e4e4;border-top-color:var(--ink);border-radius:50%;animation:ftspin 0.9s linear infinite}
@keyframes ftspin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div data-theme="light" style="min-height:900px;background:var(--surface);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:20px;display:flex;flex-wrap:wrap">

<aside style="flex:1 1 220px;max-width:100%;background:#f7f6f5;border-right:1px solid #e7e4e4;padding:16px 12px;display:flex;flex-direction:column;gap:4px">
<strong style="font-size:15px;font-weight:600;padding:2px 10px 14px">RFP Buddy</strong>
<a class="navi" href="#" style="background:#ebe8e7">RFPs</a>
<a class="navi" href="#">Rubric</a>
</aside>

<main style="flex:999 1 560px;min-width:0;padding:24px 32px 48px">
<div style="max-width:960px;display:flex;flex-direction:column;gap:20px">

<a href="#" style="font-size:14px;color:#5e5858;text-decoration:none">← All RFPs</a>

<!-- Header: names arrive first -->
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px">
<div style="display:flex;flex-direction:column;gap:2px;min-width:0">
<span style="font-size:14px;color:#5e5858">Riverbend Youth Wellness Alliance</span>
<h1 style="margin:0;font-size:24px;line-height:30px;font-weight:500;letter-spacing:-0.02em">Brand Strategy, Visual Identity, Campaign Toolkit, and Website Redesign</h1>
</div>
<span style="display:inline-flex;align-items:center;gap:8px;padding:3px 10px;border-radius:999px;border:1px solid #d6d2d2;font-size:13px;white-space:nowrap"><span class="spin" aria-hidden="true"></span>Reading the RFP</span>
</div>

<!-- Progress -->
<div role="status" aria-live="polite" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:12px 16px;border-radius:8px;background:#f7f6f5">
<span class="step"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>RFP saved</span>
<span class="step"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Client and RFP name</span>
<span class="step"><span class="spin" aria-hidden="true"></span>Drive folder</span>
<span class="step"><span class="spin" aria-hidden="true"></span>Dates and fit review</span>
<span style="flex:1"></span>
<span style="font-size:13px;color:#5e5858">Usually 2–3 minutes. You can leave this page.</span>
</div>

<!-- Key facts skeleton -->
<div style="display:flex;flex-wrap:wrap;gap:8px" aria-hidden="true">
<span class="sk" style="width:240px;height:30px"></span>
<span class="sk" style="width:270px;height:30px"></span>
<span class="sk" style="width:200px;height:30px"></span>
<span class="sk" style="width:210px;height:30px"></span>
<span class="sk" style="width:120px;height:30px"></span>
</div>

<!-- Fit card skeleton -->
<div class="card" aria-hidden="true" style="display:flex;flex-direction:column;gap:18px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px">
<div style="display:flex;flex-direction:column;gap:10px">
<span class="sk" style="width:180px;height:36px"></span>
<span class="sk" style="width:420px;max-width:100%;height:14px"></span>
</div>
<div style="display:flex;gap:8px"><span class="sk" style="width:120px;height:36px"></span><span class="sk" style="width:70px;height:36px"></span></div>
</div>
<div style="display:flex;flex-direction:column;gap:0">
<div style="display:flex;gap:16px;padding:14px 0;border-top:1px solid #e7e4e4"><span class="sk" style="width:220px;height:14px"></span><span class="sk" style="width:36px;height:14px"></span><span class="sk" style="flex:1;height:14px"></span></div>
<div style="display:flex;gap:16px;padding:14px 0;border-top:1px solid #e7e4e4"><span class="sk" style="width:200px;height:14px"></span><span class="sk" style="width:36px;height:14px"></span><span class="sk" style="flex:1;height:14px"></span></div>
<div style="display:flex;gap:16px;padding:14px 0;border-top:1px solid #e7e4e4"><span class="sk" style="width:230px;height:14px"></span><span class="sk" style="width:36px;height:14px"></span><span class="sk" style="flex:1;height:14px"></span></div>
<div style="display:flex;gap:16px;padding:14px 0;border-top:1px solid #e7e4e4"><span class="sk" style="width:210px;height:14px"></span><span class="sk" style="width:36px;height:14px"></span><span class="sk" style="flex:1;height:14px"></span></div>
</div>
</div>

<!-- Risks + questions skeleton -->
<div style="display:flex;flex-direction:column;gap:20px" aria-hidden="true">
<div class="card" style="display:flex;flex-direction:column;gap:12px"><span class="sk" style="width:110px;height:16px"></span><span class="sk" style="width:100%;height:12px"></span><span class="sk" style="width:90%;height:12px"></span><span class="sk" style="width:95%;height:12px"></span></div>
<div class="card" style="display:flex;flex-direction:column;gap:12px"><span class="sk" style="width:140px;height:16px"></span><span class="sk" style="width:100%;height:12px"></span><span class="sk" style="width:85%;height:12px"></span><span class="sk" style="width:92%;height:12px"></span></div>
</div>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
